<style>
    /* ... existing styles ... */

    /* Hero Section with Larger Logo */
    .hero-section {
        background: linear-gradient(rgba(32, 56, 63, 0.85), rgba(32, 56, 63, 0.7)), 
                    url('https://images.unsplash.com/photo-1506443432602-ac2fcd6f54e0?auto=format&fit=crop&w=1920&q=80');
        background-size: cover;
        background-position: center;
        min-height: 85vh; /* Increased height to fit larger logo */
        display: flex;
        align-items: center;
        color: white;
        text-align: center;
        padding: 60px 0;
    }

    .hero-logo { 
        max-width: 550px; /* Increased from 350px */
        width: 90%;       /* Ensures it stays responsive on mobile */
        margin-bottom: 2.5rem; 
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        animation: float 6s ease-in-out infinite; /* Smooth floating effect */
    }

    /* Animation for the Logo */
    @keyframes float {
        0% { transform: translatey(0px); }
        50% { transform: translatey(-15px); }
        100% { transform: translatey(0px); }
    }

    /* Adjusting text for better balance with large logo */
    .hero-section h2 {
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 10px;
    }
</style>

<header class="hero-section">
    <div class="container">
        <img src="logo-main.png" alt="406 Nation Logo" class="hero-logo">
        
        <div class="mt-4">

            <p class="lead mb-5 opacity-75 fs-4">Custom Apparel • Personalized Hats • Community Spirit</p>
            <a href="#contact" class="btn btn-brand btn-lg shadow-lg px-5 py-3">Get a Custom Quote</a>
        </div>
    </div>
